[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numlib-linalg"
version = "0.1.0"
description = "Dense numerical linear algebra from scratch in pure Python, benchmarked against LAPACK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Iker Abad" }]
keywords = [
  "eigenvalues",
  "eigenvectors",
  "linear-algebra",
  "lu-decomposition",
  "numerical-linear-algebra",
  "pca",
  "qr-decomposition",
  "svd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]
publish = ["build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/IkerAbad/numlib"
Repository = "https://github.com/IkerAbad/numlib"
Issues = "https://github.com/IkerAbad/numlib/issues"
Changelog = "https://github.com/IkerAbad/numlib/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/numlib-linalg/"

[tool.hatch.build.targets.wheel]
packages = ["src/numlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
