[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numlib"
version = "0.1.0"
description = "Numerical linear algebra from scratch in pure Python, benchmarked against LAPACK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Iker Abad" }]
keywords = ["numerical-linear-algebra", "lu", "qr", "svd", "eigenvalues"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/numlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
